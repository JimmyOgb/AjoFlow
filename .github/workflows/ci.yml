name: AjoFlow CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compile Base Sepolia contracts
        run: npx hardhat compile

      - name: Compile Reactive Lasna contract
        run: npx hardhat compile --config hardhat.reactive.config.js

      - name: Run Solhint static analysis
        run: npm run lint:sol

      - name: Check code formatting with Prettier
        run: npm run format:check
