name: AjoFlow CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify repository structure
        run: |
          test -d contracts
          test -d reactive
          test -d frontend
          test -d docs
          echo "Repository directory structure validated successfully."
